name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Test
        run: swift test

      - name: Build app and DMG (universal)
        run: UNIVERSAL=1 ./build-dmg.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SamsungTV4Mac-dmg
          path: .build/release/*.dmg

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" .build/release/*.dmg --title "SamsungTV4Mac ${GITHUB_REF_NAME#v}" --generate-notes
